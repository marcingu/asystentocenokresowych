# Wymogi zgodności dla integracji z EZD RP, funkcji AI i bezpieczeństwa kont: Kodeks pracy, RODO, AI Act, KSC, KRI.
# Stan prawny sprawdzony 21.11.2026 (API ELI Sejmu, Urząd Publikacji UE). Zmiana prawa = zmiana wartości tutaj.
# Uzasadnienie: dokumentacja/analiza-prawna-ai-act-kp-rodo.md

[zrodla]
kodeks_pracy = "ustawa z dnia 26 czerwca 1974 r. - Kodeks pracy (t.j. Dz. U. z 2026 r. poz. 1245; zmiana z Dz. U. z 2026 r. poz. 1046 nie dotyczy art. 22[2]-22[3])"
sluzba_cywilna = "ustawa z dnia 21 listopada 2008 r. o służbie cywilnej (t.j. Dz. U. z 2026 r. poz. 590), art. 9 ust. 1 i art. 81"
ai_act = "rozporządzenie (UE) 2024/1689 zmienione rozporządzeniem (UE) 2026/1744 (wersja skonsolidowana z 27.07.2026)"
rodo = "rozporządzenie (UE) 2016/679"
ezdrp_api = "EZD RP Integrator API v2, specyfikacja OpenAPI v2.11.5 z 10.09.2026"
ksc = "ustawa z dnia 5 lipca 2018 r. o krajowym systemie cyberbezpieczeństwa (t.j. Dz. U. z 2026 r. poz. 20, zm. poz. 252, 815, 1003 i 1206), art. 8 i załącznik nr 4"
kri = "rozporządzenie Rady Ministrów z dnia 21 maja 2024 r. w sprawie Krajowych Ram Interoperacyjności, minimalnych wymagań dla rejestrów publicznych i wymiany informacji w postaci elektronicznej oraz minimalnych wymagań dla systemów teleinformatycznych (Dz. U. z 2024 r. poz. 773), § 19 i § 20"

[bezpieczenstwo]
# zał. nr 4 część I pkt 6 ustawy o KSC: zawieszanie uprawnień w przypadku niewykonywania obowiązków co najmniej przez jeden miesiąc
zawieszenie_konta_po_miesiacach = 1
# § 20 ust. 4 KRI: informacje w dziennikach systemów przechowuje się dwa lata, gdy przepisy odrębne nie wskazują innego okresu
dziennik_przechowywanie_lat = 2

[monitoring]
# art. 22[2] § 7 w zw. z art. 22[3] § 3 i 4 KP: pracodawca informuje pracowników nie później niż 2 tygodnie przed uruchomieniem
wyprzedzenie_informacji_dni = 14

[wiedza_o_pracy]
# decyzja projektowa: przy mniejszej liczbie zdarzeń mediana i wskaźniki procentowe nie są liczone
min_licznosc_wskaznika = 5

[ezdrp]
prefiks = "/ezdrp/integrator/v2"
rozmiar_strony = 50
pierwsza_strona = 1               # do potwierdzenia na instancji; kolejne strony wg pageInfo z odpowiedzi
status_sprawy_zakonczona = 4

[ezdrp.statusy_sprawy]            # opis pola `status` w POST /sprawy/_search
"1" = "w toku"
"2" = "odłożona"
"3" = "zawieszona"
"4" = "zakończona"
"5" = "wznowiona"
"6" = "przerejestrowana"
"7" = "zarchiwizowana"
"8" = "w trakcie archiwizacji"
"11" = "przydzielone"
"12" = "w trakcie brakowania"
"13" = "zbrakowana"
"14" = "przygotowane do brakowania"
"16" = "do poprawy archiwum"
"17" = "zamówiona do wycofania z archiwum"
"18" = "zaakceptowana do wycofania z archiwum"

[ezdrp.wyniki_akceptacji]         # TypStatusAkceptacji w GET /dokumenty/{id}/akceptacje
"1" = "zaakceptowany"
"2" = "odrzucony"
"3" = "do akceptacji"
"4" = "anulowany"

# Rejestr funkcji AI. Klasyfikacje: poza_zalacznikiem_III | wyjatek_art_6_ust_3 | wysokie_ryzyko | zakazana.
# W tym pliku nie da się włączyć funkcji o klasyfikacji wysokie_ryzyko ani zakazana. Funkcję wysokiego ryzyka
# włącza wyłącznie decyzja urzędu zapisana w osobnym pliku wdrożenia (zmienna ASYSTENT_DECYZJE_AI, wzór:
# decyzje-ai-wzor.toml), poprzedzona analizami z listy na końcu tego pliku. Funkcji zakazanej nie włącza nic.
# Włączenie nie zmienia klasyfikacji ani obowiązków urzędu.

[[funkcje_ai]]
kod = "PYTANIA_O_PROCEDURE"
opis = "Odpowiedzi na pytania o procedurę i przepisy ocen okresowych, wyłącznie na podstawie przekazanych fragmentów przepisów."
klasyfikacja = "poza_zalacznikiem_III"
podstawa = "Funkcja nie służy podejmowaniu decyzji o pracowniku ani monitorowaniu lub ocenie jego wydajności i zachowania (zał. III pkt 4 lit. b AI Act). Obowiązek przejrzystości: art. 50 ust. 1 AI Act."
wlaczona = true

[[funkcje_ai]]
kod = "KOREKTA_JEZYKOWA_UZASADNIENIA"
opis = "Korekta językowa uzasadnienia napisanego przez oceniającego, bez zmiany treści i ocen."
klasyfikacja = "wyjatek_art_6_ust_3"
podstawa = "Art. 6 ust. 3 lit. b AI Act - poprawa wyniku zakończonej uprzednio czynności człowieka (motyw 53: korekta językowa przygotowanych wcześniej dokumentów). Funkcja nie ocenia czynników osobowych, więc nie profiluje (art. 4 pkt 4 RODO). Dostawca dokumentuje ocenę i rejestruje system: art. 6 ust. 4 i art. 49 ust. 2 AI Act."
wlaczona = true

[[funkcje_ai]]
kod = "REDAKCJA_NOTATEK_OCENIAJACEGO"
opis = "Ułożenie notatek napisanych przez oceniającego w projekt tekstu uzasadnienia. Model nie dostaje ocen cząstkowych, wyniku oceny ani danych z EZD RP i nie proponuje ocen; projekt przyjmuje, zmienia albo odrzuca oceniający."
klasyfikacja = "wyjatek_art_6_ust_3"
podstawa = "Art. 6 ust. 3 lit. d AI Act - zadanie przygotowawcze w kontekście oceny dokonywanej przez człowieka (motyw 53: przetwarzanie tekstów). Funkcja porządkuje tekst napisany przez oceniającego i nie ocenia czynników osobowych, więc nie profiluje (art. 4 pkt 4 RODO; art. 6 ust. 3 akapit trzeci AI Act). Kwalifikacja robocza z 21.11.2026 - do potwierdzenia przez prawnika przed wdrożeniem. Dostawca dokumentuje ocenę i rejestruje system: art. 6 ust. 4 i art. 49 ust. 2 AI Act."
wlaczona = true

[[funkcje_ai]]
kod = "PYTANIA_DO_ROZMOWY_OCENIAJACEJ"
opis = "Pytania do rozmowy oceniającej ułożone z notatek napisanych przez oceniającego. Model nie dostaje ocen cząstkowych, wyniku oceny ani danych z EZD RP, nie ocenia pracownika i nie proponuje ocen; pytania wybiera i zadaje oceniający."
klasyfikacja = "wyjatek_art_6_ust_3"
podstawa = "Art. 6 ust. 3 lit. d AI Act - zadanie przygotowawcze w kontekście oceny dokonywanej przez człowieka (rozmowa oceniająca, § 10 rozp.). Funkcja układa pytania z tekstu napisanego przez oceniającego i nie ocenia czynników osobowych, więc nie profiluje (art. 4 pkt 4 RODO). Kwalifikacja robocza - do potwierdzenia przez prawnika urzędu."
wlaczona = true

[[funkcje_ai]]
kod = "PROPOZYCJA_OCENY"
opis = "Sugestia ocen cząstkowych dla oceniającego na podstawie jego własnych notatek: obserwacji, dodatkowych osiągnięć pracownika i wyniku egzaminu. Model nie dostaje danych z EZD RP ani szkicu oceny. Sugestii nie da się przenieść do formularza - oceny wpisuje i za ocenę odpowiada oceniający."
klasyfikacja = "wysokie_ryzyko"
podstawa = "Zał. III pkt 4 lit. b AI Act (ocena wydajności i zachowania; decyzje o awansie lub rozwiązaniu stosunku pracy). Ocena efektów pracy to profilowanie (art. 4 pkt 4 RODO), więc wyjątki z art. 6 ust. 3 nie mają zastosowania (art. 6 ust. 3 akapit trzeci)."
wlaczona = false

[[funkcje_ai]]
kod = "PROPOZYCJA_KIERUNKOW_IPRZ"
opis = "Propozycja kierunków rozwoju do indywidualnego programu rozwoju zawodowego na podstawie notatek oceniającego. Model nie dostaje danych z EZD RP ani szkicu oceny. Propozycję przyjmuje, zmienia albo odrzuca oceniający - wnioski do IPRZ wpisuje sam."
klasyfikacja = "wysokie_ryzyko"
podstawa = "Zał. III pkt 4 lit. b AI Act (ocena wydajności i zachowania). Model wskazuje potrzeby rozwojowe konkretnej osoby, czyli ocenia czynniki osobowe - to profilowanie (art. 4 pkt 4 RODO), więc wyjątki z art. 6 ust. 3 nie mają zastosowania (art. 6 ust. 3 akapit trzeci). Kwalifikacja ostrożnościowa - do potwierdzenia przez prawnika urzędu."
wlaczona = false

[[funkcje_ai]]
kod = "RADAR_PYTANIA_DO_KART"
opis = "Pytania otwarte dla przełożonego do kart obserwacji Radaru Dobrostanu i Doceniania. Model dostaje liczby z kart (urlopy, godziny nadliczbowe, sprawy z EZD RP) bez danych osobowych; nie stawia diagnoz i nie ocenia. Karty liczy zwykły kod - bez modelu."
klasyfikacja = "wysokie_ryzyko"
podstawa = "Zał. III pkt 4 lit. b AI Act (monitorowanie i ocena wydajności i zachowania osób w stosunkach pracy). Model przetwarza liczby o pracy konkretnej osoby - to profilowanie (art. 4 pkt 4 RODO), więc wyjątki z art. 6 ust. 3 nie mają zastosowania (art. 6 ust. 3 akapit trzeci). Kwalifikacja ostrożnościowa - do potwierdzenia przez prawnika urzędu."
wlaczona = false

[[funkcje_ai]]
kod = "PODSUMOWANIE_PRACY_PRACOWNIKA"
opis = "Generowane przez model podsumowanie lub interpretacja wskaźników pracy konkretnej osoby."
klasyfikacja = "wysokie_ryzyko"
podstawa = "Zał. III pkt 4 lit. b AI Act (monitorowanie lub ocena wydajności i zachowania) oraz art. 6 ust. 3 akapit trzeci AI Act (profilowanie)."
wlaczona = false

[[funkcje_ai]]
kod = "REKOMENDACJA_KADROWA"
opis = "Rekomendacja zwolnienia, awansu lub nagrody albo ranking pracowników."
klasyfikacja = "wysokie_ryzyko"
podstawa = "Zał. III pkt 4 lit. b AI Act (decyzje o awansie lub rozwiązaniu stosunku pracy) i art. 6 ust. 3 akapit trzeci AI Act; art. 22 ust. 1 RODO, gdy decyzja opiera się wyłącznie na zautomatyzowanym przetwarzaniu."
wlaczona = false

[[funkcje_ai]]
kod = "ANALIZA_EMOCJI"
opis = "Wnioskowanie o emocjach pracownika."
klasyfikacja = "zakazana"
podstawa = "Art. 5 ust. 1 lit. f AI Act - zakaz wyciągania wniosków o emocjach osoby fizycznej w miejscu pracy."
wlaczona = false

# Analizy i czynności, które urząd wykonuje, zanim włączy funkcję wysokiego ryzyka. O włączeniu decyduje urząd:
# jego decyzja (plik wskazany zmienną ASYSTENT_DECYZJE_AI, wzór: decyzje-ai-wzor.toml) podaje organ, datę i dokument
# dla każdej pozycji z tej listy - inaczej system funkcji nie uruchomi. Lista to minimum sprawdzone w tekście
# powołanych przepisów, a nie pełny katalog obowiązków: zakres analiz ustala urząd z prawnikiem i inspektorem
# ochrony danych i może dopisać tu własne pozycje. Lista dotyczy urzędu jako podmiotu stosującego - obowiązków
# dostawcy systemu (art. 16 AI Act) nie obejmuje. Rozdział III sekcje 1-3 AI Act (m.in. art. 26 i 27) stosuje się
# do systemów wysokiego ryzyka z załącznika III od 2.12.2027 (art. 113 lit. c ppkt (i)); RODO stosuje się już teraz.

[[warunki_wlaczenia_wysokiego_ryzyka]]
kod = "OCENA_SKUTKOW_DLA_PRAW_PODSTAWOWYCH"
nazwa = "ocena skutków dla praw podstawowych"
podstawa = "art. 27 ust. 1 AI Act"

[[warunki_wlaczenia_wysokiego_ryzyka]]
kod = "OCENA_SKUTKOW_DLA_OCHRONY_DANYCH"
nazwa = "ocena skutków dla ochrony danych"
podstawa = "art. 35 RODO; art. 26 ust. 9 AI Act"

[[warunki_wlaczenia_wysokiego_ryzyka]]
kod = "NADZOR_CZLOWIEKA"
nazwa = "powierzenie nadzoru nad funkcją osobom z kompetencjami, przeszkoleniem i uprawnieniami"
podstawa = "art. 26 ust. 2 AI Act"

[[warunki_wlaczenia_wysokiego_ryzyka]]
kod = "POINFORMOWANIE_PRACOWNIKOW"
nazwa = "poinformowanie pracowników i ich przedstawicieli przed użyciem funkcji"
podstawa = "art. 26 ust. 7 AI Act"

[[warunki_wlaczenia_wysokiego_ryzyka]]
kod = "REJESTRACJA_W_BAZIE_UE"
nazwa = "rejestracja użycia funkcji w bazie danych UE, po sprawdzeniu, że system zarejestrował dostawca"
podstawa = "art. 49 ust. 3 i art. 26 ust. 8 AI Act"
