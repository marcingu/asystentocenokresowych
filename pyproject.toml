[project]
name = "asystent-ocen"
version = "0.0.1"
description = "Cyfrowy Asystent Ocen Okresowych - rdzeń reguł i aplikacja (HackNation 2026, zadanie KPRM)"
requires-python = ">=3.11"
# Tylko licencje permisywne: Django - BSD-3-Clause, python-docx - MIT.
dependencies = [
    "django>=5.2,<5.3",
    "python-docx>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7", "python-dateutil>=2.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "interpretacja: reguła oparta na interpretacji (Poradnik KPRM lub przyjęte założenie) - do potwierdzenia z mentorami KPRM",
    "decyzja_projektowa: zachowanie nieokreślone w przepisach, przyjęte przez zespół",
]
